# 読みの直し。docs/voicevox.md を参照。
# 1) user_dict：VOICEVOX のユーザー辞書（表記, 読み, アクセント核の位置）。動画固有の語は video.yaml の user_dict に足す。
# 2) reading_fix：読み上げる文だけに効く正規表現の置き換え（字幕はそのまま）。
user_dict:
  - [PNG, ピーエヌジー, 0]
  - [JPEG, ジェイペグ, 3]
  - [GIF, ジフ, 1]
  - [RGB, アールジービー, 0]
  - [Windows, ウィンドウズ, 3]
  - [Mac, マック, 1]
reading_fix:
  - [値, あたい]                                        # ネ と読まれる
  - ["(?<![改銀実旅流飛])行(?![くかきけこっ])", ぎょう]    # クダリ と読まれる。改行・銀行などは除く
  - ["表(?![すしさせそ])", ひょう]                       # オモテ と読まれる。表す などは除く
  - [「, ""]
  - [」, ""]
  - [＋, たす]
  - [−, ひく]
  - [×, かける]
