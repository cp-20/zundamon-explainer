# 立ち絵の置き方と表情。layer のキーは assets/characters/<name>/parts.json のグループパス
# （坂本アヒル式 PSD を tools/export_psd_parts.py で書き出したもの）。
# "*名前" はラジオ式（1 つだけ表示）、"!名前" は常に表示のグループ。
speakers:
  Z:
    name: zundamon
    display: ずんだもん
    color: [124, 195, 90]          # 字幕の縁取り・画面の色
    placement: {scale: 0.5, x: -31, y: 486, flip: true}   # 素材は左向きなので反転して内側を向かせる
    base: {"!眉": 基本眉, "!口": ほほえみ}
    mouth: {closed: ほほえみ, half: ほあ, open: ほあー}
    blink: {"!目": 閉じ目}
    expressions:
      通常: {}
      笑: {"!目": にっこり, "!眉": 上がり眉}
      驚: {"!目": 〇〇, "!眉": 上がり眉, "!右腕": 手を挙げる, "!左腕": 手を挙げる}
      困: {"!眉": 困り眉, "!右腕": 口元}
      考: {"!眉": 基本眉2, "!目": 基本目↑, "!左腕": あごに指}
      得意: {"!目": ^^, "!眉": 上がり眉}
    no_blink: [笑, 得意]            # 目を閉じている表情ではまばたきしない
  M:
    name: metan
    display: 四国めたん
    color: [227, 96, 154]
    placement: {scale: 0.5, x: 1418, y: 462}
    base: {"!口": ほほえみ, "*白ロリ服/!左腕": 普通}
    mouth: {closed: ほほえみ, half: お, open: わあー}
    blink: {"!目": 目閉じ}
    expressions:
      通常: {"*白ロリ服/!右腕": 指差す, "*白ロリ服/!左腕": 普通}
      笑: {"!目": 目閉じ2, "*白ロリ服/!右腕": 普通, "*白ロリ服/!左腕": 普通}
      驚: {"!目": ○○, "*白ロリ服/!右腕": 手をかざす, "*白ロリ服/!左腕": 普通}
      困: {"!眉": こまり, "*白ロリ服/!右腕": 普通, "*白ロリ服/!左腕": 口元に指}
      考: {"!眉": 太眉こまり, "*白ロリ服/!右腕": 普通, "*白ロリ服/!左腕": 口元に指}
      得意: {"!眉": ごきげん, "*白ロリ服/!右腕": 指差す, "*白ロリ服/!左腕": 普通}
    no_blink: [笑]
