# AVIF 編 (第 6 作)。公開済み：https://youtu.be/UstNOfWVg9c
slug: avif
title: HEICとほぼ同じ13,179バイト、なのに特許料0円。AVIFの中身をのぞいてみた【ずんだもん解説】
youtube: https://youtu.be/UstNOfWVg9c
thumbnail: B
description: |
  同じ写真が、HEICだと13,368バイト、AVIFだと13,179バイト。ファイルサイズはほぼ同じなのに、AVIFは特許料がかからず、いまの主なブラウザならどれでも開けます。
  特許を避けて作られた動画の規格AV1は、HEICとは別の工夫で画像を圧縮しています。実際のAVIFファイルを自前で読み解いて、高校生にも分かるように解説します。
  画面の数値は、すべて実物のファイルから計算した値です。PNG編・JPEG編・GIF編・WebP編・HEIC編とあわせてどうぞ。

  ■ シリーズ
  PNG編：https://youtu.be/BhYgIYsvkBo
  JPEG編：https://youtu.be/dZP4YsrL6nw
  GIF編：https://youtu.be/1bv3UpIbnM4
  WebP編：https://youtu.be/pWV0v-tolTU
  HEIC編：https://youtu.be/-Aqzhf8QRy0
