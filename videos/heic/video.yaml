# HEIC 編 (第 5 作)。公開済み：https://youtu.be/-Aqzhf8QRy0
slug: heic
title: 謎の拡張子HEIC、実はWebPより2割小さかった【ずんだもん解説】
youtube: https://youtu.be/-Aqzhf8QRy0
thumbnail: V3
description: |
  同じ写真が、JPEGだと23,693バイト、WebPだと16,974バイト、HEICだと13,368バイト。iPhoneの写真の形式HEICは、なぜここまで小さいのか？
  箱の中に箱が入ったHEIFのファイル、写真に合わせて大きさを変えるブロック、35通りの予想とその向きの予想、確率を覚えながら書くCABAC、山と谷をならすSAOまで。実際のHEICファイルを自前で読み解いて、高校生にも分かるように解説します。
  画面の数値は、すべて実物のファイルから計算した値です。PNG編・JPEG編・GIF編・WebP編とあわせてどうぞ。

