<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Hiragino Sans','Yu Gothic','Meiryo','Noto Sans JP','Noto Sans CJK JP',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a93a6"/>
    </marker>
    <style>
      .card { fill: #ffffff; stroke: #d8dde6; stroke-width: 1.5; }
      .title { font-size: 17px; font-weight: 700; fill: #1f2430; }
      .file { font-size: 12px; fill: #6b7385; font-family: 'JetBrains Mono','Menlo',monospace; }
      .body { font-size: 13px; fill: #3b4252; }
      .lane { font-size: 13px; font-weight: 700; fill: #8a93a6; letter-spacing: 1px; }
      .flow { stroke: #8a93a6; stroke-width: 2.2; fill: none; }
      .dash { stroke: #b6bdca; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="470" rx="18" fill="#f5f7fb"/>

  <!-- 上段：音と映像の流れ -->
  <text x="24" y="38" class="lane">作る流れ</text>

  <!-- 1 台詞 -->
  <rect x="20" y="54" width="160" height="128" rx="12" class="card"/>
  <rect x="20" y="54" width="160" height="8" rx="4" fill="#f2c14e"/>
  <text x="36" y="90" class="title">台詞と計画</text>
  <text x="36" y="110" class="file">PLAN.md</text>
  <text x="36" y="138" class="body">Z と M の掛け合い</text>
  <text x="36" y="158" class="body">{キュー} [表記|よみ] 間</text>

  <!-- 2 音声 -->
  <rect x="205" y="54" width="160" height="128" rx="12" class="card"/>
  <rect x="205" y="54" width="160" height="8" rx="4" fill="#7cc35a"/>
  <text x="221" y="90" class="title">音声</text>
  <text x="221" y="110" class="file">zunda/voice.py</text>
  <text x="221" y="138" class="body">VOICEVOX で合成</text>
  <text x="221" y="158" class="body">キュー・字幕・口の時刻</text>

  <!-- 3 画面 -->
  <rect x="390" y="54" width="160" height="128" rx="12" class="card"/>
  <rect x="390" y="54" width="160" height="8" rx="4" fill="#4fd1e8"/>
  <text x="406" y="90" class="title">画面</text>
  <text x="406" y="110" class="file">scenes/*.py</text>
  <text x="406" y="138" class="body">Manim で図を描く</text>
  <text x="406" y="158" class="body">キューの時刻で動かす</text>

  <!-- 4 合成 -->
  <rect x="575" y="54" width="160" height="128" rx="12" class="card"/>
  <rect x="575" y="54" width="160" height="8" rx="4" fill="#e3609a"/>
  <text x="591" y="90" class="title">合成</text>
  <text x="591" y="110" class="file">zunda/compose.py</text>
  <text x="591" y="138" class="body">立ち絵の口パク</text>
  <text x="591" y="158" class="body">まばたき・字幕</text>

  <!-- 5 仕上げ -->
  <rect x="760" y="54" width="180" height="128" rx="12" class="card"/>
  <rect x="760" y="54" width="180" height="8" rx="4" fill="#a58bf0"/>
  <text x="776" y="90" class="title">仕上げ → 動画</text>
  <text x="776" y="110" class="file">zunda/master.py</text>
  <text x="776" y="138" class="body">BGM を台詞で下げる</text>
  <text x="776" y="158" class="body">-14 LUFS・結合</text>

  <path d="M180,118 L203,118" class="flow" marker-end="url(#arrow)"/>
  <path d="M365,118 L388,118" class="flow" marker-end="url(#arrow)"/>
  <path d="M550,118 L573,118" class="flow" marker-end="url(#arrow)"/>
  <path d="M735,118 L758,118" class="flow" marker-end="url(#arrow)"/>
  <!-- 音声の時刻表は合成と仕上げにも使う -->
  <path d="M285,182 C285,212 655,212 655,184" class="dash" marker-end="url(#arrow)"/>

  <!-- 中段：数字の出どころ -->
  <text x="24" y="250" class="lane">画面の数字の出どころ</text>

  <rect x="20" y="266" width="160" height="96" rx="12" class="card"/>
  <text x="36" y="298" class="title">題材のファイル</text>
  <text x="36" y="318" class="file">videos/*/data/</text>
  <text x="36" y="344" class="body">PNG・JPEG・GIF など</text>

  <rect x="205" y="266" width="160" height="96" rx="12" class="card"/>
  <text x="221" y="298" class="title">自前の解析器</text>
  <text x="221" y="318" class="file">tools/*analyze.py</text>
  <text x="221" y="344" class="body">既存の実装と一致を確認</text>

  <rect x="390" y="266" width="160" height="96" rx="12" class="card"/>
  <text x="406" y="298" class="title">データの読み出し</text>
  <text x="406" y="318" class="file">vlib/data.py</text>
  <text x="406" y="344" class="body">台詞の数字と assert</text>

  <path d="M180,314 L203,314" class="flow" marker-end="url(#arrow)"/>
  <path d="M365,314 L388,314" class="flow" marker-end="url(#arrow)"/>
  <path d="M470,266 L470,184" class="flow" marker-end="url(#arrow)"/>

  <!-- 右：確かめる -->
  <rect x="575" y="266" width="365" height="104" rx="12" fill="#fff8e6" stroke="#f2c14e" stroke-width="1.5"/>
  <text x="591" y="298" class="title">確かめる</text>
  <text x="591" y="320" class="file">tools/check.py · tools/sheet.py</text>
  <text x="591" y="340" class="body">検査：はみ出し・重なり・遅れ・ちらつき</text>
  <text x="591" y="362" class="body">シート：状態ごとのフレームと台詞</text>

  <!-- 下段：設定と知見 -->
  <rect x="20" y="392" width="920" height="58" rx="12" fill="#eef1f7" stroke="#d8dde6" stroke-width="1.2"/>
  <text x="36" y="418" class="title">共通の設定</text>
  <text x="36" y="438" class="file">config/*.yaml</text>
  <text x="250" y="418" class="title">動画ごとの設定</text>
  <text x="250" y="438" class="file">videos/*/video.yaml</text>
  <text x="500" y="418" class="title">知見</text>
  <text x="500" y="438" class="file">AGENTS.md · docs/</text>
  <text x="700" y="418" class="title">コマンド</text>
  <text x="700" y="438" class="file">bin/pipeline.sh · build_all.sh</text>
</svg>
